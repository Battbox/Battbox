<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Libnan TV — Free live Arabic television. Lebanon, Iraq, Palestine, Syria, Gulf, News and more. No subscription required.">
<meta name="theme-color" content="#00d97e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libnan TV">
<title>Libnan TV — Live Arabic Television</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<!-- FIX C1: Preconnect to major stream CDNs for faster tune-in -->
<link rel="preconnect" href="https://mysat-live.ercdn.net">
<link rel="preconnect" href="https://shls-live-enc.edgenextcdn.net">
<link rel="preconnect" href="https://svs.itworkscdn.net">
<link rel="preconnect" href="https://akamaized.net" crossorigin>
<link rel="preconnect" href="https://live.alarabiya.net">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080a0d;
  --bg2:#0d1117;
  --bg3:#111820;
  --surface:#141c26;
  --surface2:#1a2535;
  --border:#1e2d3d;
  --green:#00d97e;
  --green2:#00b869;
  --green-glow:rgba(0,217,126,0.15);
  --red:#e63946;
  --red-glow:rgba(230,57,70,0.2);
  --gold:#f4b942;
  --white:#f0f4f8;
  --muted:#6b7f96;
  --text:#cdd9e5;
  --font:'Outfit',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--white);font-family:var(--font);overflow:hidden}
/* FIX: Use 100dvh so Android Chrome address bar doesn't cover UI */
#app{display:flex;flex-direction:column;height:100dvh}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#1e2d3d;border-radius:2px}

/* ─── HEADER ─── */
#hdr{
  height:58px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;
  background:linear-gradient(to bottom,rgba(8,10,13,0.98),rgba(8,10,13,0.7));
  border-bottom:1px solid var(--border);
  position:relative;z-index:100;
  backdrop-filter:blur(12px);
}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--green),#007a45);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:#000;
  box-shadow:0 0 18px var(--green-glow);
  letter-spacing:-0.5px;
  font-family:'Cairo',sans-serif;
}
.logo-text{font-size:19px;font-weight:900;letter-spacing:-0.5px;color:var(--white)}
.logo-text span{color:var(--green)}
.logo-sub{font-size:8px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:12px}
.clock{font-size:14px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;letter-spacing:1px}
.live-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--red-glow);border:1px solid rgba(230,57,70,0.3);
  border-radius:20px;padding:4px 10px;
  font-size:9px;font-weight:700;color:var(--red);letter-spacing:1.5px
}
.dot{width:5px;height:5px;border-radius:50%;animation:blink 1.4s infinite}
.dot-red{background:var(--red);box-shadow:0 0 6px var(--red)}
.dot-green{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot-amber{background:var(--gold)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

/* ─── NAV ─── */
#nav{
  height:44px;flex-shrink:0;display:flex;align-items:stretch;
  padding:0 20px;background:var(--bg2);
  border-bottom:1px solid var(--border);overflow-x:auto;gap:2px
}
#nav::-webkit-scrollbar{display:none}
.nt{
  flex-shrink:0;padding:0 16px;background:none;border:none;
  border-bottom:2px solid transparent;
  color:var(--muted);font-size:12px;font-weight:600;
  cursor:pointer;white-space:nowrap;
  transition:color 0.2s,border-color 0.2s;
  font-family:var(--font);letter-spacing:0.3px
}
.nt:hover{color:var(--text)}
.nt.on{color:var(--green);border-bottom-color:var(--green)}
.nb{
  background:var(--surface);border-radius:4px;
  padding:1px 5px;font-size:10px;margin-left:4px;color:var(--muted)
}
.nt.on .nb{background:rgba(0,217,126,0.12);color:var(--green)}

/* ─── BODY ─── */
#body{flex:1;overflow:hidden;position:relative}
.sc{display:none;position:absolute;inset:0;overflow-y:auto}
.sc.on{display:block}
.sc-flex{display:none;position:absolute;inset:0}
.sc-flex.on{display:flex}

/* ─── HOME ─── */
.home-wrap{padding-bottom:30px}

/* Hero Carousel */
#hero{
  position:relative;height:320px;overflow:hidden;
  background:var(--bg);
  flex-shrink:0;
}
.hero-slide{
  position:absolute;inset:0;
  display:flex;align-items:flex-end;
  padding:30px 28px;
  opacity:0;transition:opacity 0.7s ease;
  pointer-events:none;
}
.hero-slide.active{opacity:1;pointer-events:all}
.hero-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  filter:blur(0px);
  transition:transform 8s ease;
}
.hero-slide.active .hero-bg{transform:scale(1.04)}
.hero-grad{
  position:absolute;inset:0;
  background:linear-gradient(
    to right,
    rgba(8,10,13,0.97) 0%,
    rgba(8,10,13,0.8) 40%,
    rgba(8,10,13,0.3) 70%,
    rgba(8,10,13,0.1) 100%
  ),linear-gradient(to top,rgba(8,10,13,0.95) 0%,transparent 50%)
}
.hero-content{position:relative;z-index:2;max-width:420px}
.hero-cat{
  font-size:9px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--green);
  margin-bottom:8px;display:flex;align-items:center;gap:6px
}
.hero-cat::before{content:'';width:18px;height:2px;background:var(--green);border-radius:1px}
.hero-title{
  font-size:28px;font-weight:900;line-height:1.1;
  color:var(--white);margin-bottom:6px;
  letter-spacing:-0.5px
}
.hero-sub{font-size:12px;color:rgba(205,217,229,0.7);margin-bottom:16px;line-height:1.5}
.hero-btns{display:flex;gap:10px;align-items:center}
.btn-watch{
  display:flex;align-items:center;gap:7px;
  background:var(--green);color:#000;
  border:none;border-radius:8px;padding:9px 18px;
  font-size:12px;font-weight:800;cursor:pointer;
  font-family:var(--font);letter-spacing:0.3px;
  transition:background 0.2s,transform 0.1s;
  box-shadow:0 0 20px var(--green-glow)
}
.btn-watch:hover{background:var(--green2);transform:translateY(-1px)}
.btn-watch:active{transform:translateY(0)}
.btn-info{
  background:rgba(240,244,248,0.08);border:1px solid rgba(240,244,248,0.15);
  color:var(--text);border-radius:8px;padding:9px 16px;
  font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);
  transition:background 0.2s
}
.btn-info:hover{background:rgba(240,244,248,0.14)}
.play-icon{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:9px solid #000}

/* Carousel dots */
#hero-dots{
  position:absolute;bottom:14px;right:20px;
  display:flex;gap:5px;z-index:10
}
.hdot{
  width:6px;height:6px;border-radius:3px;
  background:rgba(240,244,248,0.25);
  cursor:pointer;transition:all 0.3s
}
.hdot.on{width:20px;background:var(--green)}

/* Hero logo badge */
.hero-logo-badge{
  position:absolute;top:20px;right:20px;z-index:10;
  width:64px;height:64px;border-radius:12px;
  background:rgba(13,17,23,0.85);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);overflow:hidden
}
.hero-logo-badge img{width:48px;height:48px;object-fit:contain}
.hero-logo-badge .hero-logo-text{
  font-size:11px;font-weight:800;color:var(--white);
  text-align:center;padding:4px;line-height:1.2
}

/* ─── SECTION ROWS ─── */
.home-sections{padding:0 0 20px}
.home-section{margin-bottom:6px}
.sec-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 20px 10px
}
.sec-title{
  font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:8px;
  color:var(--white);letter-spacing:0.2px
}
.sec-bar{width:3px;height:14px;background:var(--green);border-radius:2px;flex-shrink:0}
.sec-bar.red{background:var(--red)}
.sec-bar.gold{background:var(--gold)}
.sec-more{
  font-size:11px;color:var(--green);cursor:pointer;
  background:none;border:none;font-family:var(--font);
  font-weight:600;opacity:0.8;
  transition:opacity 0.2s
}
.sec-more:hover{opacity:1}
.ch-row{
  display:flex;gap:10px;overflow-x:auto;
  padding:0 20px 8px;
}
.ch-row::-webkit-scrollbar{display:none}
.empty-msg{color:var(--muted);font-size:12px;padding:8px 20px}

/* ─── CHANNEL CARDS (row) ─── */
.row-card{
  flex-shrink:0;width:130px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;overflow:hidden;
  cursor:pointer;
  transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s;
  position:relative
}
.row-card:hover{
  transform:translateY(-4px) scale(1.02);
  border-color:var(--green);
  box-shadow:0 8px 30px rgba(0,0,0,0.5),0 0 20px var(--green-glow)
}
.row-card:active{transform:scale(0.97)}
.rc-art{
  height:72px;display:flex;align-items:center;
  justify-content:center;position:relative;overflow:hidden
}
.rc-art-bg{position:absolute;inset:0;opacity:0.25}
.rc-logo{
  width:52px;height:52px;object-fit:contain;
  position:relative;z-index:1;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6))
}
.rc-logo-ph{
  font-size:11px;font-weight:800;
  color:rgba(255,255,255,0.85);
  position:relative;z-index:1;
  letter-spacing:0.5px;text-align:center;padding:0 6px
}
.rc-live-dot{
  position:absolute;top:6px;left:6px;z-index:3;
  width:7px;height:7px;border-radius:50%;
  background:#333;
}
.rc-live-dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
.rc-live-dot.bad{background:var(--red);box-shadow:0 0 4px var(--red)}
.rc-info{padding:7px 9px 8px}
.rc-name{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--white)}
.rc-cat{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:1px}

/* Recently watched card variation */
.rw-card{
  flex-shrink:0;width:160px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;overflow:hidden;
  cursor:pointer;
  transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s;
}
.rw-card:hover{
  transform:translateY(-4px);
  border-color:var(--green);
  box-shadow:0 8px 30px rgba(0,0,0,0.5)
}
.rw-art{
  height:88px;display:flex;align-items:center;
  justify-content:center;position:relative;overflow:hidden
}
.rw-logo{width:64px;height:64px;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6))}
.rw-logo-ph{font-size:12px;font-weight:800;color:rgba(255,255,255,0.85);position:relative;z-index:1}
.rw-resume{
  position:absolute;bottom:0;left:0;right:0;
  height:3px;background:var(--surface2)
}
.rw-resume-fill{height:100%;background:var(--green)}
.rw-info{padding:7px 10px 9px}
.rw-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-time{font-size:10px;color:var(--muted);margin-top:1px}

/* ─── CHANNELS SCREEN ─── */
#sc-ch{flex-direction:column}
.toolbar{
  flex-shrink:0;padding:9px 16px;
  display:flex;align-items:center;gap:8px;
  background:var(--bg2);border-bottom:1px solid var(--border);
  flex-wrap:nowrap
}
.search-wrap{position:relative;width:150px;flex-shrink:0}
.search-wrap input{
  width:100%;background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;padding:7px 10px 7px 30px;
  color:var(--white);font-size:12px;outline:none;
  font-family:var(--font);transition:border-color 0.2s
}
.search-wrap input:focus{border-color:var(--green)}
.search-wrap input::placeholder{color:var(--muted)}
.search-icon{
  position:absolute;left:8px;top:50%;
  transform:translateY(-50%);color:var(--muted);
  font-size:12px;pointer-events:none
}
.pills{display:flex;gap:5px;overflow-x:auto;flex:1}
.pills::-webkit-scrollbar{display:none}
.pill{
  flex-shrink:0;padding:5px 12px;border-radius:20px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--muted);font-size:11px;font-weight:600;
  cursor:pointer;white-space:nowrap;font-family:var(--font);
  transition:all 0.15s
}
.pill:hover{border-color:var(--green);color:var(--text)}
.pill.on{
  background:rgba(0,217,126,0.1);
  border-color:rgba(0,217,126,0.4);
  color:var(--green)
}
.grid-wrap{flex:1;overflow-y:auto;padding:14px 16px}
.ch-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:10px
}

/* ─── CHANNEL CARD (grid) ─── */
.ch-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;overflow:hidden;
  cursor:pointer;
  transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s
}
.ch-card:hover{
  transform:translateY(-3px);
  border-color:rgba(0,217,126,0.4);
  box-shadow:0 8px 24px rgba(0,0,0,0.4),0 0 16px var(--green-glow)
}
.ch-card:active{transform:scale(0.97)}
.card-art{
  height:80px;display:flex;align-items:center;
  justify-content:center;position:relative;flex-direction:column;gap:4px;
  overflow:hidden
}
.card-art-bg{position:absolute;inset:0;opacity:0.2}
.card-logo{
  width:60px;height:60px;object-fit:contain;
  position:relative;z-index:1;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,0.7))
}
.card-label{
  font-size:11px;font-weight:800;
  color:rgba(255,255,255,0.9);
  position:relative;z-index:1;
  letter-spacing:0.5px;text-shadow:0 1px 4px rgba(0,0,0,0.8);
  text-align:center;padding:0 6px
}
.card-hdot{
  position:absolute;top:7px;left:7px;z-index:2;
  width:7px;height:7px;border-radius:50%;background:#333
}
.card-hdot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
.card-hdot.bad{background:var(--red)}
.card-body{padding:8px 10px}
.card-name{
  font-size:11px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:2px;color:var(--white)
}
.card-cat{
  font-size:9px;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.5px
}

/* ─── PLAYER ─── */
/* Approach: position:fixed covers full viewport.
   #pv fills the remaining space (all of it on mobile, minus sidebar on desktop).
   video is position:absolute inside #pv — fills it completely.
   #ptop and #pbot are position:absolute inside #pv — overlay the video.
   This is how YouTube, Netflix and every streaming app does it. */

#sc-player{
  display:none !important;
  position:fixed;
  top:0;left:0;width:100vw;height:100dvh;
  z-index:2147483647; /* FIX: Max z-index — stays above mobile browser UI bars */
  background:#000;
  flex-direction:row;
}
#sc-player.on{ display:flex !important; }

/* #pv must be a block with explicit dimensions so absolute children anchor correctly */
#pv{
  flex:1;
  position:relative;
  background:#000;
  /* width and height must be defined — flex:1 gives width, height:100% gives height */
  width:0; /* flex:1 overrides this but needed for min-width calc */
  height:100%;
}
video{
  position:absolute;
  top:0;left:0;width:100%;height:100%;
  object-fit:contain;
  background:#000;
}
#ytc{position:absolute;top:0;left:0;width:100%;height:100%;display:none}
#ytc iframe{width:100%;height:100%;border:none}

/* Controls overlay the video — anchored inside #pv */
/* FIX A1: --pbot-h measured dynamically by ResizeObserver in JS below */
#pv{ --pbot-h:86px; }
#ptop{
  position:absolute;top:0;left:0;right:0;z-index:20;
  /* FIX B1: safe-area insets for notched phones */
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  padding-left:calc(16px + env(safe-area-inset-left,0px));
  padding-right:calc(16px + env(safe-area-inset-right,0px));
  padding-bottom:12px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.85),transparent);
  display:flex;justify-content:space-between;align-items:flex-start;
  transition:opacity 0.35s ease,transform 0.35s ease;
}
#pbot{
  position:absolute;bottom:0;left:0;right:0;z-index:20;
  /* FIX B1: safe-area insets for home-bar devices */
  padding-top:10px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:calc(14px + env(safe-area-inset-left,0px));
  padding-right:calc(14px + env(safe-area-inset-right,0px));
  background:linear-gradient(to top,rgba(0,0,0,0.9),transparent);
  transition:opacity 0.35s ease,transform 0.35s ease;
}
/* FIX A1: shrink video so bottom controls never overlap the stream */
#pv:not(.controls-hidden) video,
#pv:not(.controls-hidden) #ytc{ height:calc(100% - var(--pbot-h)); }
#pv.controls-hidden video,
#pv.controls-hidden #ytc{ height:100%; }
#pv.controls-hidden #pbot{opacity:0;transform:translateY(10px);pointer-events:none}
#pv.controls-hidden #ptop{opacity:0;transform:translateY(-10px);pointer-events:none}
/* FIX B1: safe-area for error screen close button */
#perr-close{
  top:calc(16px + env(safe-area-inset-top,0px));
  left:calc(16px + env(safe-area-inset-left,0px));
}

/* Desktop sidebar */
#pside{
  width:240px;
  flex-shrink:0;
  height:100%;
  display:flex;flex-direction:column;
  background:var(--bg2);
  border-left:1px solid var(--border);
  overflow:hidden;
}

/* Mobile — no sidebar, video takes full width */
@media(max-width:768px){
  #pside{ display:none !important; }
}
@media(max-width:900px) and (orientation:landscape){
  #pside{ display:none !important; }
}


#pld{
  display:none;position:absolute;inset:0;
  background:rgba(8,10,13,0.85);
  align-items:center;justify-content:center;
  flex-direction:column;gap:12px;z-index:20;
  backdrop-filter:blur(4px)
}
#pld.on{display:flex}
.spn{
  width:36px;height:36px;
  border:3px solid var(--border);
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin 0.8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.spt{font-size:11px;color:var(--green);font-weight:600;letter-spacing:0.5px}

#perr{
  display:none;position:absolute;inset:0;
  background:var(--bg);
  flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:28px;
  text-align:center;z-index:25
}
#perr.on{display:flex}
/* Always-visible close button on error screen */
#perr-close{
  position:absolute;top:16px;left:16px;
  background:rgba(230,57,70,0.12);
  border:1px solid rgba(230,57,70,0.3);
  color:var(--red);
  width:44px;height:44px;border-radius:10px;
  font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font);font-weight:700;
  transition:background 0.15s;
  -webkit-tap-highlight-color:transparent;
}
#perr-close:hover,#perr-close:active{background:rgba(230,57,70,0.28)}
.err-icon{font-size:32px}
.err-title{font-size:15px;font-weight:800;color:var(--red)}
.err-body{font-size:11px;color:var(--muted);max-width:220px;line-height:1.6}
.err-nav{display:flex;gap:10px;margin-top:4px}
.err-nav-btn{
  display:flex;align-items:center;gap:7px;
  padding:10px 18px;border-radius:9px;border:none;cursor:pointer;
  font-size:12px;font-weight:700;font-family:var(--font);
  transition:all 0.15s
}
.err-nav-btn.prev{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.err-nav-btn.prev:hover{border-color:var(--green);color:var(--green)}
.err-nav-btn.next{background:var(--green);color:#000}
.err-nav-btn.next:hover{background:var(--green2)}

// LIBNAN TV — APPLICATION ENGINE
// Rebuilt to drive the existing markup: home rows, hero carousel,
// channel grid + search/filters, and the HLS player with
// multi-CDN automatic failover. All handlers are global so the
// inline onclick="" attributes in the HTML resolve correctly.
// ═══════════════════════════════════════════════════════════
'use strict';

var $ = function (id) { return document.getElementById(id); };

var LIST        = Array.isArray(window.CH) ? CH.slice() : [];
var curCat      = 'all';
var curScreen   = 'home';
var returnScreen = 'home';
var playIdx     = -1;
var hls         = null;
var streamIdx   = 0;
var loadTimer   = null;
var ctlTimer    = null;
var progT       = null;
var suppressTap = false;

var HERO_IDS = ['aljadeed', 'aljazeera', 'mbc1', 'alarabiya', 'lbc', 'mayadeen'];
var heroIdx = 0, heroCount = 0, heroTimer = null;

// ─── helpers ───────────────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m];
  });
}
function byId(id) { for (var i = 0; i < LIST.length; i++) { if (LIST[i].id === id) return LIST[i]; } return null; }
function byCat(cat) { return LIST.filter(function (c) { return c.cat === cat; }); }
function flagEmoji(cc) {
  if (!cc || cc.length !== 2) return '';
  return cc.toUpperCase().replace(/./g, function (ch) { return String.fromCodePoint(127397 + ch.charCodeAt(0)); });
}
function shortName(name) {
  var w = String(name).split(/\s+/).filter(Boolean);
  return w.slice(0, 2).join(' ');
}
function abbr(name) {
  var w = String(name).replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean);
  if (!w.length) return String(name).slice(0, 2).toUpperCase();
  if (w.length === 1) return w[0].slice(0, 3).toUpperCase();
  return (w[0][0] + w[1][0] + (w[2] ? w[2][0] : '')).toUpperCase();
}
function artBg(c) {
  var col = c.color || '#00d97e';
  return 'background:radial-gradient(circle at 50% 30%,' + col + '55,transparent 72%),' + col + '18';
}
function timeAgo(ts) {
  var s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'Just now';
  var m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

// ─── local storage: favourites + history ───────────────────
function favs() { try { return JSON.parse(localStorage.getItem('lt_favs') || '[]'); } catch (e) { return []; } }
function setFavs(a) { try { localStorage.setItem('lt_favs', JSON.stringify(a)); } catch (e) {} }
function isFav(id) { return favs().indexOf(id) >= 0; }
function favToggle(ev, id) {
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  var a = favs(), i = a.indexOf(id);
  if (i >= 0) { a.splice(i, 1); toast('Removed from favourites'); }
  else { a.push(id); toast('Added to favourites'); }
  setFavs(a); renderFavs(); renderGrid();
  return false;
}
function hist() { try { return JSON.parse(localStorage.getItem('lt_hist') || '[]'); } catch (e) { return []; } }
function recordHist(id) {
  var h = hist().filter(function (x) { return x.id !== id; });
  h.unshift({ id: id, ts: Date.now() });
  h = h.slice(0, 12);
  try { localStorage.setItem('lt_hist', JSON.stringify(h)); } catch (e) {}
  renderRecent();
}
function clearHist() { try { localStorage.removeItem('lt_hist'); } catch (e) {} renderRecent(); toast('Continue Watching cleared'); }

// ─── card templates ────────────────────────────────────────
function rowCard(c) {
  return '<div class="row-card" tabindex="0" onclick="play(\'' + c.id + '\')">' +
    '<div class="rc-art"><div class="rc-art-bg" style="' + artBg(c) + '"></div>' +
    '<div class="rc-live-dot ok"></div>' +
    '<div class="rc-logo-ph">' + esc(c.name) + '</div></div>' +
    '<div class="rc-info"><div class="rc-name">' + esc(c.name) + '</div>' +
    '<div class="rc-cat">' + flagEmoji(c.flag) + ' ' + esc(c.cat) + '</div></div></div>';
}
function rwCard(c, ts) {
  return '<div class="rw-card" tabindex="0" onclick="play(\'' + c.id + '\')">' +
    '<div class="rw-art"><div class="rc-art-bg" style="' + artBg(c) + '"></div>' +
    '<div class="rw-logo-ph">' + esc(c.name) + '</div>' +
    '<div class="rw-resume"><div class="rw-resume-fill" style="width:100%"></div></div></div>' +
    '<div class="rw-info"><div class="rw-name">' + esc(c.name) + '</div>' +
    '<div class="rw-time">' + timeAgo(ts) + '</div></div></div>';
}
function gridCard(c) {
  return '<div class="ch-card" tabindex="0" data-id="' + c.id + '" onclick="cardTap(\'' + c.id + '\')" oncontextmenu="return favToggle(event,\'' + c.id + '\')">' +
    '<div class="card-art"><div class="card-art-bg" style="' + artBg(c) + '"></div>' +
    '<div class="card-hdot' + (isFav(c.id) ? ' ok' : '') + '"></div>' +
    '<div class="card-label">' + flagEmoji(c.flag) + '<br>' + esc(c.name) + '</div></div>' +
    '<div class="card-body"><div class="card-name">' + esc(c.name) + '</div>' +
    '<div class="card-cat">' + esc(c.cat) + '</div></div></div>';
}
function sideItem(c) {
  return '<div class="side-ch-item" tabindex="0" onclick="play(\'' + c.id + '\')">' +
    '<div class="side-ch-logo"><span>' + esc(abbr(c.name)) + '</span></div>' +
    '<div class="side-ch-name">' + esc(c.name) + '</div>' +
    '<div class="side-ch-dot ok"></div></div>';
}

// ─── home ──────────────────────────────────────────────────
function fill(id, arr) {
  var el = $(id); if (!el) return;
  el.innerHTML = arr.length ? arr.map(rowCard).join('') : '<div class="empty-msg">No channels available</div>';
}
function renderHome() {
  renderHero();
  fill('lb-row', byCat('Lebanon'));
  fill('news-row', byCat('News'));
  fill('sports-row', byCat('Sports'));
  fill('iraq-row', byCat('Iraq'));
  fill('ps-row', LIST.filter(function (c) { return c.cat === 'Palestine' || c.cat === 'Syria'; }));
  fill('drama-row', byCat('Drama'));
  renderRecent();
  renderFavs();
}
function renderRecent() {
  var h = hist(), sec = $('sec-recent');
  if (!sec) return;
  if (!h.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  $('rw-row').innerHTML = h.map(function (x) { var c = byId(x.id); return c ? rwCard(c, x.ts) : ''; }).join('');
}
function renderFavs() {
  var arr = favs().map(byId).filter(Boolean), sec = $('sec-favs');
  if (!sec) return;
  if (!arr.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  $('fav-row').innerHTML = arr.map(rowCard).join('');
}

// ─── hero carousel ─────────────────────────────────────────
function renderHero() {
  var hero = $('hero'); if (!hero) return;
  var slides = HERO_IDS.map(byId).filter(Boolean);
  if (!slides.length) slides = LIST.slice(0, 5);
  heroCount = slides.length;
  var s = '', dots = '';
  slides.forEach(function (c, i) {
    s += '<div class="hero-slide' + (i === 0 ? ' active' : '') + '" data-i="' + i + '">' +
      '<div class="hero-bg" style="background:radial-gradient(circle at 28% 30%,' + (c.color || '#00d97e') + '99,#080a0d 68%)"></div>' +
      '<div class="hero-grad"></div>' +
      '<div class="hero-logo-badge"><div class="hero-logo-text">' + esc(shortName(c.name)) + '</div></div>' +
      '<div class="hero-content">' +
      '<div class="hero-cat">' + flagEmoji(c.flag) + ' ' + esc(c.cat) + ' &middot; Live</div>' +
      '<div class="hero-title">' + esc(c.name) + '</div>' +
      '<div class="hero-sub">Streaming live now &mdash; tap watch to tune in, with automatic backup sources if a stream drops.</div>' +
      '<div class="hero-btns">' +
      '<button class="btn-watch" onclick="play(\'' + c.id + '\')"><span class="play-icon"></span> Watch Live</button>' +
      '<button class="btn-info" onclick="filterAndGo(\'' + c.cat + '\')">More ' + esc(c.cat) + '</button>' +
      '</div></div></div>';
    dots += '<div class="hdot' + (i === 0 ? ' on' : '') + '" onclick="heroGo(' + i + ')"></div>';
  });
  hero.innerHTML = s + '<div id="hero-dots">' + dots + '</div>';
  heroIdx = 0;
  startHeroRotate();
}
function heroGo(i) {
  if (!heroCount) return;
  heroIdx = ((i % heroCount) + heroCount) % heroCount;
  var sl = $('hero').querySelectorAll('.hero-slide');
  var dt = $('hero').querySelectorAll('.hdot');
  sl.forEach(function (e, j) { e.classList.toggle('active', j === heroIdx); });
  dt.forEach(function (e, j) { e.classList.toggle('on', j === heroIdx); });
  startHeroRotate();
}
function startHeroRotate() { stopHeroRotate(); if (heroCount > 1) heroTimer = setInterval(function () { heroGo(heroIdx + 1); }, 6000); }
function stopHeroRotate() { if (heroTimer) clearInterval(heroTimer); heroTimer = null; }

// ─── channels screen ───────────────────────────────────────
function renderGrid() {
  var g = $('ch-grid'); if (!g) return;
  var q = (($('sq') && $('sq').value) || '').trim().toLowerCase();
  var arr = LIST.filter(function (c) {
    var okCat = curCat === 'all' || c.cat === curCat;
    var okQ = !q || c.name.toLowerCase().indexOf(q) >= 0 || c.cat.toLowerCase().indexOf(q) >= 0;
    return okCat && okQ;
  });
  g.innerHTML = arr.length ? arr.map(gridCard).join('') : '<div class="empty-msg">No channels match your search.</div>';
  attachLongPress(g);
}
function filterCh() { renderGrid(); }
function setCat(cat, el) {
  curCat = cat;
  document.querySelectorAll('#cat-pills .pill').forEach(function (p) { p.classList.remove('on'); });
  if (el) el.classList.add('on');
  renderGrid();
}
function setCatByName(cat) {
  curCat = cat;
  document.querySelectorAll('#cat-pills .pill').forEach(function (p) {
    var m = /setCat\('([^']+)'/.exec(p.getAttribute('onclick') || '');
    p.classList.toggle('on', !!m && m[1] === cat);
  });
  renderGrid();
}
function filterAndGo(cat) {
  go('ch');
  if ($('sq')) $('sq').value = '';
  setCatByName(cat);
}
function prunePills() {
  document.querySelectorAll('#cat-pills .pill').forEach(function (p) {
    var m = /setCat\('([^']+)'/.exec(p.getAttribute('onclick') || '');
    if (!m) return;
    var cat = m[1];
    if (cat === 'all') return;
    if (!LIST.some(function (c) { return c.cat === cat; })) p.style.display = 'none';
  });
}

// ─── navigation ────────────────────────────────────────────
function go(screen, el) {
  if (curScreen !== 'player') returnScreen = curScreen;
  curScreen = screen;
  var map = { home: 'sc-home', ch: 'sc-ch', player: 'sc-player' };
  ['sc-home', 'sc-ch', 'sc-player'].forEach(function (s) { var n = $(s); if (n) n.classList.remove('on'); });
  if ($(map[screen])) $(map[screen]).classList.add('on');
  var nts = document.querySelectorAll('.nt');
  nts.forEach(function (b) { b.classList.remove('on'); });
  if (screen === 'home' && nts[0]) nts[0].classList.add('on');
  else if (screen === 'ch' && nts[1]) nts[1].classList.add('on');
  else if (screen === 'player') { var np = $('nav-play'); if (np) { np.style.display = ''; np.classList.add('on'); } }
}

// ─── cards → play ──────────────────────────────────────────
function cardTap(id) { if (suppressTap) { suppressTap = false; return; } play(id); }
function attachLongPress(container) {
  container.querySelectorAll('.ch-card').forEach(function (card) {
    var tm;
    card.addEventListener('touchstart', function () {
      tm = setTimeout(function () { suppressTap = true; favToggle(null, card.dataset.id); }, 550);
    }, { passive: true });
    ['touchend', 'touchmove', 'touchcancel'].forEach(function (ev) {
      card.addEventListener(ev, function () { clearTimeout(tm); });
    });
  });
}

// ─── player ────────────────────────────────────────────────
function play(id) {
  var idx = -1;
  for (var i = 0; i < LIST.length; i++) { if (LIST[i].id === id) { idx = i; break; } }
  if (idx < 0) return;
  playIdx = idx;
  var c = LIST[idx];
  go('player');
  if ($('p-ch-name')) $('p-ch-name').textContent = c.name;
  if ($('p-ch-prog')) $('p-ch-prog').textContent = 'Live broadcast';
  if ($('pside-ch')) $('pside-ch').textContent = c.name;
  if ($('pside-cat')) $('pside-cat').textContent = c.cat;
  if ($('pside-now-t')) $('pside-now-t').textContent = 'Live Stream';
  if ($('pside-now-s')) $('pside-now-s').textContent = c.name + ' · ' + c.cat;
  renderSidebar(c);
  buildErrLinks(c);
  recordHist(id);
  streamIdx = 0;
  startStream();
  showControls();
  startProg();
}
function renderSidebar(c) {
  var others = LIST.filter(function (x) { return x.cat === c.cat && x.id !== c.id; });
  if (others.length < 4) {
    others = others.concat(LIST.filter(function (x) { return x.cat !== c.cat && x.id !== c.id; }));
  }
  $('pup-slots').innerHTML = others.slice(0, 12).map(sideItem).join('');
}
function buildErrLinks(c) {
  var box = $('err-links'); if (!box) return;
  box.innerHTML = c.web
    ? '<a class="erl" href="' + esc(c.web) + '" target="_blank" rel="noopener">Open ' + esc(c.name) + ' official site <span>&#8599;</span></a>'
    : '';
}
function startStream() {
  var c = LIST[playIdx]; if (!c) return;
  clearTimeout(loadTimer);
  if ($('perr')) $('perr').classList.remove('on');
  setLoading(true, streamIdx > 0 ? 'Trying backup source ' + (streamIdx + 1) + '…' : 'Connecting…');
  var url = c.streams && c.streams[streamIdx];
  if (!url) { showError(); return; }
  var vid = $('vid');
  destroyHls();
  loadTimer = setTimeout(function () { nextSource(); }, 13000);

  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 24, manifestLoadingMaxRetry: 1, levelLoadingMaxRetry: 2, fragLoadingMaxRetry: 3, lowLatencyMode: false });
    hls.loadSource(url);
    hls.attachMedia(vid);
    hls.on(Hls.Events.MANIFEST_PARSED, function () { buildQuality(); tryPlay(); });
    hls.on(Hls.Events.ERROR, function (evt, data) {
      if (!data || !data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        try { hls.recoverMediaError(); } catch (e) { nextSource(); }
      } else {
        nextSource();
      }
    });
  } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
    if ($('pbtn-quality')) $('pbtn-quality').style.display = 'none';
    vid.src = url;
    vid.addEventListener('loadedmetadata', tryPlay, { once: true });
    vid.addEventListener('error', function () { nextSource(); }, { once: true });
  } else {
    showError();
  }
}
function tryPlay() {
  var vid = $('vid');
  var p = vid.play();
  if (p && p.catch) {
    p.then(onPlaying).catch(function () {
      vid.muted = true; syncMute();
      var p2 = vid.play();
      if (p2 && p2.catch) { p2.then(onPlaying).catch(function () { onPlaying(); }); } else { onPlaying(); }
      toast('Muted — tap 🔊 to enable sound');
    });
  } else { onPlaying(); }
}
function onPlaying() {
  clearTimeout(loadTimer);
  setLoading(false);
  if ($('pbtn-play')) $('pbtn-play').textContent = '⏸';
}
function nextSource() {
  clearTimeout(loadTimer);
  streamIdx++;
  var c = LIST[playIdx];
  if (c && c.streams && streamIdx < c.streams.length) startStream();
  else showError();
}
function showError() {
  clearTimeout(loadTimer);
  setLoading(false);
  destroyHls();
  var c = LIST[playIdx];
  if ($('err-body')) {
    $('err-body').textContent = 'All ' + (c && c.streams ? c.streams.length : 0) +
      ' sources were tried for ' + (c ? c.name : 'this channel') +
      '. It may be geo-blocked or temporarily offline.';
  }
  if ($('perr')) $('perr').classList.add('on');
}
function setLoading(on, txt) {
  var l = $('pld'); if (!l) return;
  if (on) { l.classList.add('on'); if (txt) { var t = l.querySelector('.spt'); if (t) t.textContent = txt; } }
  else { l.classList.remove('on'); }
}
function destroyHls() { if (hls) { try { hls.destroy(); } catch (e) {} hls = null; } }

// ─── quality menu ──────────────────────────────────────────
function buildQuality() {
  var box = $('quality-items'); if (!box) return;
  if (!hls || !hls.levels || !hls.levels.length) { box.innerHTML = '<div class="qm-item active" onclick="togQualityMenu(true)">Auto</div>'; if ($('pbtn-quality')) $('pbtn-quality').textContent = 'HD'; return; }
  var html = '<div class="qm-item active" onclick="setQuality(-1)">Auto</div>';
  hls.levels.forEach(function (l, i) {
    var lbl = l.height ? l.height + 'p' : (Math.round(l.bitrate / 1000) + 'k');
    html += '<div class="qm-item" onclick="setQuality(' + i + ')">' + lbl + '</div>';
  });
  box.innerHTML = html;
  if ($('pbtn-quality')) { $('pbtn-quality').style.display = ''; $('pbtn-quality').textContent = 'AUTO'; }
}
function setQuality(i) {
  if (!hls) return;
  hls.currentLevel = i;
  var items = document.querySelectorAll('#quality-items .qm-item');
  items.forEach(function (el) { el.classList.remove('active'); });
  if (items[i + 1]) items[i + 1].classList.add('active');
  if ($('pbtn-quality')) $('pbtn-quality').textContent = i < 0 ? 'AUTO' : ((hls.levels[i] && hls.levels[i].height) ? hls.levels[i].height : 'HD');
  togQualityMenu(true);
}
function togQualityMenu(forceClose) {
  var m = $('quality-menu'); if (!m) return;
  if (forceClose) { m.classList.remove('on'); return; }
  m.classList.toggle('on');
}

// ─── transport controls ────────────────────────────────────
function togPause() {
  var v = $('vid');
  if (v.paused) { v.play(); if ($('pbtn-play')) $('pbtn-play').textContent = '⏸'; }
  else { v.pause(); if ($('pbtn-play')) $('pbtn-play').textContent = '▶'; }
}
function syncMute() { if ($('pbtn-mute')) $('pbtn-mute').textContent = $('vid').muted ? '🔇' : '🔊'; }
function togMute() { var v = $('vid'); v.muted = !v.muted; syncMute(); }
function retryStream() { streamIdx = 0; startStream(); }
function jumpTo(i) { var n = LIST.length; if (!n) return; i = ((i % n) + n) % n; play(LIST[i].id); }
function prevCh() { jumpTo(playIdx - 1); }
function nextCh() { jumpTo(playIdx + 1); }
function jumpCh(d) { jumpTo(playIdx + d); }
function goFullscreen() {
  var el = $('sc-player');
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
  }
}
function closePlayer() {
  destroyHls();
  var v = $('vid');
  try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
  clearTimeout(loadTimer);
  stopProg();
  if ($('quality-menu')) $('quality-menu').classList.remove('on');
  if ($('nav-play')) { $('nav-play').style.display = 'none'; $('nav-play').classList.remove('on'); }
  go(returnScreen || 'home');
}

// ─── controls auto-hide + live progress ────────────────────
function showControls() {
  var pv = $('pv'); if (!pv) return;
  pv.classList.remove('controls-hidden');
  clearTimeout(ctlTimer);
  ctlTimer = setTimeout(function () { if (!$('vid').paused) pv.classList.add('controls-hidden'); }, 4000);
}
function startProg() { stopProg(); updateProg(); progT = setInterval(updateProg, 1000); }
function stopProg() { if (progT) clearInterval(progT); progT = null; }
function updateProg() {
  var d = new Date();
  var sec = (d.getMinutes() % 30) * 60 + d.getSeconds();
  var pct = Math.floor(sec / (30 * 60) * 100);
  if ($('prog-fill')) $('prog-fill').style.width = pct + '%';
  if ($('pside-bar-f')) $('pside-bar-f').style.width = pct + '%';
}

// ─── toast + clock ─────────────────────────────────────────
var toastT = null;
function toast(m) {
  var t = $('toast'); if (!t) return;
  t.textContent = m; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.classList.remove('on'); }, 2000);
}
function startClock() {
  function u() {
    if (!$('clock')) return;
    var d = new Date();
    $('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  u(); setInterval(u, 1000);
}

// ─── keyboard / TV remote ──────────────────────────────────
function onKey(e) {
  if (curScreen !== 'player') return;
  if (e.key === 'Escape') { closePlayer(); }
  else if (e.key === 'ArrowRight' || e.key === 'MediaTrackNext') { nextCh(); }
  else if (e.key === 'ArrowLeft' || e.key === 'MediaTrackPrevious') { prevCh(); }
  else if (e.key === ' ' || e.key === 'MediaPlayPause') {
    if (e.target === document.body) { e.preventDefault(); togPause(); }
  }
}

// ─── player wiring ─────────────────────────────────────────
function setupPlayerEvents() {
  var v = $('vid');
  if (v) {
    v.playsInline = true;
    v.addEventListener('playing', function () { clearTimeout(loadTimer); setLoading(false); if ($('pbtn-play')) $('pbtn-play').textContent = '⏸'; });
    v.addEventListener('waiting', function () { setLoading(true, 'Buffering…'); });
    v.addEventListener('pause', function () { if ($('pbtn-play')) $('pbtn-play').textContent = '▶'; });
    v.addEventListener('play', function () { if ($('pbtn-play')) $('pbtn-play').textContent = '⏸'; });
  }
  var pv = $('pv');
  if (pv) {
    pv.addEventListener('click', function (e) {
      if (e.target.closest && (e.target.closest('#pbot') || e.target.closest('#ptop') || e.target.closest('#quality-menu') || e.target.closest('#perr'))) return;
      if (pv.classList.contains('controls-hidden')) showControls();
      else pv.classList.add('controls-hidden');
    });
    if (window.ResizeObserver && $('pbot')) {
      var ro = new ResizeObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
          pv.style.setProperty('--pbot-h', (entries[i].contentRect.height + 6) + 'px');
        }
      });
      ro.observe($('pbot'));
    }
  }
  document.addEventListener('keydown', onKey);
}

// ─── init ──────────────────────────────────────────────────
function init() {
  if ($('nb-ch')) $('nb-ch').textContent = LIST.length;
  prunePills();
  renderHome();
  renderGrid();
  startClock();
  setupPlayerEvents();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
</body>
</html>
